schema_version: "0.2.0"
record_type: failure_boundary

boundary_id: boundary.origin.unverified.v1
name: Unverified Origin

condition_type: missing_evidence

condition: >
  The claimed origin cannot be supported by primary
  or equivalent provenance evidence.

severity: blocker
on_match: escalate_to_deep

evidence_requirement: >
  Primary-source evidence or independently auditable
  provenance evidence is required.

description: >
  Prevents automatic KATA reuse when origin attribution
  is materially uncertain.

