schema_version: "0.3.0"
record_type: reasoning_kata

kata_id: kata.origin-trace-royalty.v2
name: Origin-Trace-Royalty Structural Analysis
version: "2.0.0"
status: validated
domain: ecosystem_analysis

activation_conditions:
  intent_patterns:
    - structural_analysis
    - monetization_shift
    - ecosystem_change

  domain: ecosystem_analysis

  required_evidence_classes:
    - primary_source
    - policy_or_system_change

applicability_policy:
  minimum_match_score: 0.65
  require_all_conditions: true
  boundary_precedence: override_match

reasoning_steps:
  - step_id: origin
    action: Identify Origin
    instruction: >
      Identify the primary source of the core value,
      data, or contribution before analyzing derivatives.
    validation_criteria: >
      The identified source must be distinguishable
      from later derivative use.

  - step_id: trace
    action: Verify Trace
    instruction: >
      Determine whether transformation, provenance,
      or contribution can be meaningfully traced.
    validation_criteria: >
      The claimed transformation or contribution
      must have auditable evidence.

  - step_id: royalty
    action: Map Value Return
    instruction: >
      Evaluate whether value return or settlement
      is connected to attributed contribution.
    validation_criteria: >
      The return mechanism must be explicitly linked
      to contribution or provenance.

failure_boundary_ids:
  - boundary.origin.unverified.v1

origin_trace_ids:
  - trace.origin-discovery.20260813.001

causal_validation_ids:
  - causal.origin-analysis.002

breathing_profile_id: breathe.kata.default.v1

lineage_id: lineage.origin-trace-royalty.001
composition_id: composition.origin-trace-royalty.001
maturity_assessment_id: maturity.origin-trace-royalty.001

